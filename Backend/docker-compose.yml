services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: immune-orchestrator
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - IMMUNE_DB_PATH=/app/data/immune_memory.db
    volumes:
      - immune_data:/app/data
    networks:
      - immune_net

  agent-alpha:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: immune-agent-alpha
    environment:
      - PYTHONUNBUFFERED=1
      - AGENT_ID=node-alpha
      - ORCHESTRATOR_URL=ws://orchestrator:8000/ws
    depends_on:
      - orchestrator
    networks:
      - immune_net

  agent-beta:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: immune-agent-beta
